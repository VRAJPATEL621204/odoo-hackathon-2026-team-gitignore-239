services:
  postgres:
    image: postgres:16-alpine
    container_name: peoplepay360_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-peoplepay360}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-peoplepay360}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local SMTP server that captures every message instead of delivering it.
  # Sent mail is readable in the web UI at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: peoplepay360_mailpit
    restart: always
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Single unified container running both React Frontend and Express Backend API
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peoplepay360_app
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-peoplepay360}?schema=public&connection_limit=10&pool_timeout=10
      JWT_SECRET: ${JWT_SECRET:-c8d37f81a5e42b6d910243e8c9f5a7b134d6e8f0a2b4c6e81012141618202224}
      JWT_EXPIRES_IN_SECONDS: 28800
      COMPANY_NAME: ${COMPANY_NAME:-OXP Pvt Ltd}
      COMPANY_TIMEZONE: ${COMPANY_TIMEZONE:-Asia/Kolkata}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-payroll@peoplepay360.test}
    ports:
      - "5173:5000"
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres_data:
    driver: local
