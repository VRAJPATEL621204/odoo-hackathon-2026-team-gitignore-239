services:
  postgres:
    image: postgres:16-alpine
    container_name: peoplepay360_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-peoplepay360}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-peoplepay360}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local SMTP server that captures every message instead of delivering it.
  # The payslip email feature is therefore a real SMTP send with real PDF
  # attachments, demoable offline, with no external mail provider involved.
  # Sent mail is readable in the web UI at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: peoplepay360_mailpit
    restart: always
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
    driver: local
