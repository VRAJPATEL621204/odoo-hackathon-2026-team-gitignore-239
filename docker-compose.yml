services:
  postgres:
    image: postgres:16-alpine
    container_name: peoplepay360_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-peoplepay360}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-peoplepay360}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single unified container running both React Frontend and Express Backend API.
  # Email is sent through the authenticated SMTP provider configured in .env.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peoplepay360_app
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      SEED_DATABASE: ${SEED_DATABASE:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-peoplepay360}?schema=public&connection_limit=10&pool_timeout=10
      JWT_SECRET: ${JWT_SECRET:-c8d37f81a5e42b6d910243e8c9f5a7b134d6e8f0a2b4c6e81012141618202224}
      JWT_EXPIRES_IN_SECONDS: 28800
      COMPANY_NAME: ${COMPANY_NAME:-OXP Pvt Ltd}
      COMPANY_TIMEZONE: ${COMPANY_TIMEZONE:-Asia/Kolkata}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-5}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-60}
      RATE_LIMIT_LOGIN_ACCOUNT_MAX: ${RATE_LIMIT_LOGIN_ACCOUNT_MAX:-10}
      RATE_LIMIT_LOGIN_ACCOUNT_WINDOW: ${RATE_LIMIT_LOGIN_ACCOUNT_WINDOW:-900}
      RATE_LIMIT_LOGIN_DEVICE_MAX: ${RATE_LIMIT_LOGIN_DEVICE_MAX:-8}
      RATE_LIMIT_LOGIN_DEVICE_WINDOW: ${RATE_LIMIT_LOGIN_DEVICE_WINDOW:-60}
      MAX_BULK_EMAIL_RECIPIENTS: ${MAX_BULK_EMAIL_RECIPIENTS:-500}
      ACTION_COOLDOWN_SECONDS: ${ACTION_COOLDOWN_SECONDS:-10}
      EMAIL_COOLDOWN_SECONDS: ${EMAIL_COOLDOWN_SECONDS:-300}
      PDF_COOLDOWN_SECONDS: ${PDF_COOLDOWN_SECONDS:-5}
      WRITE_RATE_LIMIT_IP_MAX: ${WRITE_RATE_LIMIT_IP_MAX:-60}
      WRITE_RATE_LIMIT_IP_WINDOW: ${WRITE_RATE_LIMIT_IP_WINDOW:-60}
      WRITE_RATE_LIMIT_USER_MAX: ${WRITE_RATE_LIMIT_USER_MAX:-30}
      WRITE_RATE_LIMIT_USER_WINDOW: ${WRITE_RATE_LIMIT_USER_WINDOW:-60}
      # AI Chatbot Configuration
      CHATBOT_PORT: 4500
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-15000}
      PEOPLEPAY360_API_BASE_URL: http://localhost:5000
      # Google sign-in — optional. Empty disables the feature; the login page
      # hides the button and email/password login is unaffected.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
    ports:
      - "5173:5000"
      - "5000:5000"
      - "4500:4500"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
